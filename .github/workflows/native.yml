name: Cinux native build and persistence

# Manual only. The native lane bakes a Buildroot volume and takes about an
# hour, so it is not run on a schedule or on every push. The self-host cell
# this workflow used to carry retired with the in-guest kernel build, and
# run-cell no longer accepts that suite.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (Release, ${{ matrix.checks }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        checks: [none, checks]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-cinux
        with:
          kvm: 'true'
          cache-key: native-${{ matrix.checks }}
      - name: Prepare tar-capable mke2fs for the native Buildroot volume
        run: |
          bash scripts/checks/setup-mke2fs.sh "$RUNNER_TEMP/cinux-e2fsprogs"
          echo "$RUNNER_TEMP/cinux-e2fsprogs/sbin" >> "$GITHUB_PATH"
      - name: Run the native build cell
        env:
          CINUX_CHECK_JOBS: '4'
        run: bash scripts/checks/run-cell.sh native Release ${{ matrix.checks }} build-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.checks }}-logs
          path: |
            build-ci/*.log
            build-ci/*.json
            build-ci/native-gui/*.log
            build-ci/native-gui/*.ppm
            build-ci/persistence-*/*/*.log
            build-ci/persistence-*/before.fsck.log
            build-ci/CMakeCache.txt
            build-ci/qemu-device-args.txt
